name: Sync seminars from Notion

# Lab members edit the Notion seminar DB; this pulls it into
# web/content/seminars/*.md and commits (which triggers the Pages deploy).
# Runs daily and can be run on demand from the Actions tab ("Run workflow").

on:
  workflow_dispatch: {}
  schedule:
    - cron: "0 0 * * *" # 09:00 KST daily

permissions:
  contents: write

concurrency:
  group: sync-seminars
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Sync from Notion
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_SEMINAR_DB_ID: ${{ secrets.NOTION_SEMINAR_DB_ID }}
          # For mirroring Notion-uploaded PDFs to a GitHub Release (keeps the site light)
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: npm run sync:seminars
      - name: Commit & push (rebase-safe)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/seminars public/assets/seminars
          if git diff --cached --quiet; then
            echo "No seminar changes to commit."
            exit 0
          fi
          git commit -m "chore(seminar): sync from Notion"
          # main may have advanced while this ~minutes-long sync ran; rebase our
          # single commit on top instead of failing the push (non-fast-forward).
          for i in 1 2 3; do
            git pull --rebase --autostash origin main && git push origin HEAD:main && exit 0
            echo "push retry $i…"; sleep 5
          done
          echo "push failed after retries"; exit 1
